# Development/sample only.
# Do not use checked-in API keys in production.
# Production should use secret-backed configuration later.
integrationKeys:
  - name: sample-protected-api
    key: dev-sample-key
    enabled: true
    allowedIdentities:
      - Developer
      - UnknownService
      - anonymous
    allowedCapabilities:
      - DeployApplication

  - name: capability-control-demo
    key: dev-capability-control-key
    enabled: true
    allowedIdentities:
      - platform-agent
    allowedCapabilities:
      - infrastructure.production.apply
      - infrastructure.production.destroy
    environment: production

  - name: capability-control-demo-limited
    key: dev-capability-control-limited-key
    enabled: true
    allowedIdentities:
      - platform-agent
    allowedCapabilities:
      - infrastructure.production.plan
    environment: production

  - name: deployment-worker-lab
    key: dev-deployment-worker-key
    enabled: true
    allowedIdentities:
      - deployment-worker
    allowedCapabilities:
      - production.deployment.execute
    environment: production

  - name: migration-worker-lab
    key: dev-migration-worker-key
    enabled: true
    allowedIdentities:
      - migration-worker
    allowedCapabilities:
      - database.migration.execute
    environment: production

  - name: refund-worker-lab
    key: dev-refund-worker-key
    enabled: true
    allowedIdentities:
      - refund-worker
    allowedCapabilities:
      - payments.refund.create
    environment: production

  - name: release-approval-worker-lab
    key: dev-release-approval-worker-key
    enabled: true
    allowedIdentities:
      - release-approval-worker
    allowedCapabilities:
      - production.release.approve
    environment: production

  - name: github-actions-production-development
    key: dev-github-actions-key
    enabled: true
    allowedIdentities:
      - github-actions-production
    allowedCapabilities:
      - production.deployment.execute
    environment: production

  - name: terraform-production-development
    key: dev-terraform-production-key
    enabled: true
    allowedIdentities:
      - terraform-production
    allowedCapabilities:
      - infrastructure.production.apply
    environment: production
