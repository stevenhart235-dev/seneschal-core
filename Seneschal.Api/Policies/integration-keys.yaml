# Development/sample only.
# Do not use checked-in API keys in production.
# Production should use secret-backed configuration later.
integrationKeys:
  - name: sample-protected-api
    key: dev-sample-key
    enabled: true
    allowedIdentities:
      - Developer
      - UnknownService
      - anonymous
    allowedCapabilities:
      - DeployApplication

  - name: capability-control-demo
    key: dev-capability-control-key
    enabled: true
    allowedIdentities:
      - platform-agent
    allowedCapabilities:
      - infrastructure.production.apply
      - infrastructure.production.destroy
    environment: production

  - name: capability-control-demo-limited
    key: dev-capability-control-limited-key
    enabled: true
    allowedIdentities:
      - platform-agent
    allowedCapabilities:
      - infrastructure.production.plan
    environment: production
